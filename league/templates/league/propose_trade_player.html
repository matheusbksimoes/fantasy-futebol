{% extends "league/base.html" %}
{% block title %}Propor troca{% endblock %}

{% block content %}

<style>
  .trade-page {
    max-width: 1100px;
  }

  .trade-title {
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 18px;
  }

  .trade-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .trade-card {
    border: 1px solid rgba(148, 163, 184, 0.16);
    border-radius: 14px;
    padding: 16px;
    background: rgba(15, 23, 42, 0.6);
  }

  .trade-card-title {
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 12px;
    color: #f8fafc;
  }

  .trade-list {
    display: grid;
    gap: 6px;
    max-height: 420px;
    overflow-y: auto;
    padding-right: 6px;
  }

  .trade-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .trade-item:hover {
    background: rgba(30, 41, 59, 0.6);
  }

  .trade-checkbox {
    accent-color: #22c55e;
    cursor: pointer;
  }

  .trade-player {
    color: #e2e8f0;
    font-weight: 500;
  }

  .trade-actions {
    margin-top: 18px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .trade-btn {
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    font-weight: 700;
    border: none;
  }

  .trade-btn-submit {
    background: #0b57d0;
    color: #fff;
  }

  .trade-btn-submit:hover {
    background: #0a4ec2;
  }

  .trade-btn-cancel {
    background: #0f172a;
    color: #cbd5e1;
    border: 1px solid rgba(148,163,184,0.2);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
  }

  @media (max-width: 768px) {
    .trade-grid {
      grid-template-columns: 1fr;
    }

    .trade-list {
      max-height: none;
    }

    .trade-btn {
      width: 100%;
    }
  }
</style>

<div class="trade-page">
  <h1 class="trade-title">Propor troca</h1>

  <form method="post">
    {% csrf_token %}

    <div class="trade-grid">

      <!-- RECEBER -->
      <div class="trade-card">
        <div class="trade-card-title">Jogadores que você quer RECEBER</div>

        <div class="trade-list">
          {% for p in target_players %}
            <label class="trade-item">
              <input
                type="checkbox"
                class="trade-checkbox"
                name="target_players"
                value="{{ p.player.id }}"
              >
              <span class="trade-player">{{ p.player.name }}</span>
            </label>
          {% endfor %}
        </div>
      </div>

      <!-- ENVIAR -->
      <div class="trade-card">
        <div class="trade-card-title">Jogadores que você vai ENVIAR</div>

        <div class="trade-list">
          {% for p in my_players %}
            <label class="trade-item">
              <input
                type="checkbox"
                class="trade-checkbox"
                name="my_players"
                value="{{ p.player.id }}"
              >
              <span class="trade-player">{{ p.player.name }}</span>
            </label>
          {% endfor %}
        </div>
      </div>

    </div>

    <div class="trade-actions">
      <button type="submit" class="trade-btn trade-btn-submit">
        Enviar proposta
      </button>

      <a
        href="{% url 'team_roster' draft.id target_team.id %}"
        class="trade-btn trade-btn-cancel"
      >
        ← Voltar
      </a>
    </div>

  </form>
</div>

{% endblock %}
